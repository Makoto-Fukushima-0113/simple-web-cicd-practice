steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build','-t','asia-northeast1-docker.pkg.dev/$PROJECT_ID/containers/simple-web:dev-$SHORT_SHA','.']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push','asia-northeast1-docker.pkg.dev/$PROJECT_ID/containers/simple-web:dev-$SHORT_SHA']

# Alembic migrate（Cloud SQL Proxy を docker で起動して叩く）
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  secretEnv: ['DB_USER','DB_PASSWORD','DB_NAME']
  args:
  - '-c'
  - |
      set -e
      docker run -d --rm --name cloudsql-proxy --network cloudbuild gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0 --address 0.0.0.0 --port 3306 $PROJECT_ID:asia-northeast1:simple-db
      sleep 3
      docker run --rm --network cloudbuild -v /workspace:/workspace -w /workspace \
        -e DB_HOST=cloudsql-proxy -e DB_PORT=3306 \
        -e DB_USER=$$DB_USER -e DB_PASSWORD=$$DB_PASSWORD -e DB_NAME=$$DB_NAME \
        python:3.11-slim bash -c "pip install --no-cache-dir -r requirements.txt && alembic upgrade head"
      docker stop cloudsql-proxy

- name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'run'
  - 'deploy'
  - 'simple-web'
  - '--image'
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/containers/simple-web:dev-$SHORT_SHA'
  - '--region'
  - 'asia-northeast1'
  - '--no-allow-unauthenticated'
  - '--add-cloudsql-instances'
  - '$PROJECT_ID:asia-northeast1:simple-db'
  - '--set-secrets'
  - 'DB_USER=db-user:latest,DB_PASSWORD=db-password:latest,DB_NAME=db-name:latest'
  - '--set-env-vars'
  - 'ENV_NAME=dev,APP_REV=$SHORT_SHA,INSTANCE_CONNECTION_NAME=$PROJECT_ID:asia-northeast1:simple-db'

images:
- 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/containers/simple-web:dev-$SHORT_SHA'

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/db-user/versions/latest
    env: 'DB_USER'
  - versionName: projects/$PROJECT_ID/secrets/db-password/versions/latest
    env: 'DB_PASSWORD'
  - versionName: projects/$PROJECT_ID/secrets/db-name/versions/latest
    env: 'DB_NAME'

options:
  logging: CLOUD_LOGGING_ONLY
